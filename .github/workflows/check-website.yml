name: Controleer en verpak fitnesswebsite
on:
  push:
    branches: [main, "finish/**"]
    paths-ignore: ['release/**']
  workflow_dispatch:
concurrency:
  group: fitness-website-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  check-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: HTML en bezoekersroute controleren
        run: |
          python3 tests/check-site.py
          python3 tests/check-seo.py
          python3 tests/sync-seo.py --check
          python3 tests/sync-club.py --check
          python3 tests/sync-heroes.py --check
          python3 tests/sync-terms.py --check
      - name: JavaScript-syntax controleren
        run: |
          for file in *.js; do node --check "$file"; done
      - name: PHP en veilige mailinhoud controleren
        run: |
          php -v
          find api config tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/trial.php
      - name: Uitgeschakelde mailroute controleren zonder verzending
        run: |
          php -S 127.0.0.1:8085 -t . > /tmp/fcz-php.log 2>&1 &
          FCZ_PID=$!
          trap 'kill "$FCZ_PID"' EXIT
          python3 tests/http-disabled.py
      - name: Mobiele Chromium- en WebKit-controles voorbereiden
        timeout-minutes: 5
        run: |
          npm install --prefix "$RUNNER_TEMP/fcz-browser" --package-lock=false --ignore-scripts --fetch-retries=1 --fetch-timeout=30000 playwright@1.62.1
          timeout 240 docker pull mcr.microsoft.com/playwright:v1.62.1-noble
      - name: Responsive bezoekersroute en formulier testen zonder mail
        run: |
          php -S 127.0.0.1:8090 -t . > /tmp/fcz-responsive.log 2>&1 &
          FCZ_BROWSER_PID=$!
          trap 'kill "$FCZ_BROWSER_PID"' EXIT
          docker run --rm --network host -v "$PWD:/work" -v "$RUNNER_TEMP/fcz-browser:/pw:ro" -w /work -e PLAYWRIGHT_MODULE=/pw/node_modules/playwright/index.mjs mcr.microsoft.com/playwright:v1.62.1-noble node tests/responsive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fcz-responsive-controles
          path: test-results/
          retention-days: 7
      - name: Publiceerbare Hostinger-ZIP maken
        run: python3 tests/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: fitnesscentrum-zwanenburg-hostinger
          path: release/fitnesscentrum-zwanenburg-hostinger.zip
      - name: Actuele ZIP bewaren in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/fitnesscentrum-zwanenburg-hostinger.zip
          if ! git diff --cached --quiet; then
            git commit -m "Werk gecontroleerde Hostinger-ZIP bij"
            git push
          fi
